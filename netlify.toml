# Netlify is used for pull request deploy previews only.
# Production hosting is Cloudflare Pages at https://websitesbynick.co.uk/.
# Deploy previews are opt in: the ignore command skips PR builds unless the
# PR carries the `preview` label (see scripts/netlify-ignore.mjs).
[build]
  ignore = "node scripts/netlify-ignore.mjs"

[context.production]
  command = "echo '/*  https://websitesbynick.co.uk/:splat  302!' > _redirects"

# Retired concept-page routes now resolve to the public pages. Shared assets stay in place.
[[redirects]]
  from = "/homepage-concepts/"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/homepage-concepts/about/"
  to = "/about/"
  status = 301
  force = true

[[redirects]]
  from = "/homepage-concepts/pricing/"
  to = "/pricing/"
  status = 301
  force = true

[[redirects]]
  from = "/homepage-concepts/charity/"
  to = "/charity/"
  status = 301
  force = true

[[redirects]]
  from = "/homepage-concepts/contact/"
  to = "/contact/"
  status = 301
  force = true

[[redirects]]
  from = "/homepage-concepts/privacy/"
  to = "/privacy/"
  status = 301
  force = true
