<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Chess clock</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Chess clock">
<meta property="og:description" content="A free two-player chess clock with time controls and increments.">
<meta property="og:url" content="https://websitesbynick.co.uk/chess-clock/">
<meta property="og:image" content="https://websitesbynick.co.uk/chess-clock/social-preview.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://websitesbynick.co.uk/chess-clock/social-preview.png">
<meta name="twitter:title" content="Chess clock">
<meta name="twitter:description" content="A free two-player chess clock with time controls and increments.">
<link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
<script>
// Apply saved display choices before first paint so there is no flash.
(function () {
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem('chess-clock-settings') || '{}'); } catch (e) {}
  var b = document.body || document.documentElement;
  document.documentElement.dataset.theme = saved.theme || 'dark';
  document.documentElement.dataset.style = 'players';
  document.documentElement.dataset.accent = saved.accent || 'green';
})();
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }

  /* Theme and accent palettes */
  :root {
    --page-bg: #0b0d10;
    --ink: #eef1ea;
    --ink-dim: #9aa896;
    --inactive-bg: #1a1f1a;
    --inactive-ink: #aab6a4;
    --bar-bg: #10140f;
    --line: #2a332b;
    --control-bg: #1a1f1a;
    --control-ink: #cfd8c9;
    --focus: #f2ede1;
  }
  html[data-theme="light"] {
    --page-bg: #f7f4ef;
    --ink: #1c211b;
    --ink-dim: #5c655c;
    --inactive-bg: #eae5d9;
    --inactive-ink: #5f6759;
    --bar-bg: #efeadd;
    --line: #d5cfbf;
    --control-bg: #eae5d9;
    --control-ink: #3c4438;
    --focus: #22312a;
  }
  html[data-accent="green"] { --accent: #a8b598; --accent-ink: #101711; --accent-soft: #a8b59840; }
  html[data-accent="peach"] { --accent: #f0996f; --accent-ink: #241305; --accent-soft: #f0996f40; }
  html[data-accent="sky"]   { --accent: #9fc3e8; --accent-ink: #0d1a26; --accent-soft: #9fc3e840; }
  html[data-theme="light"][data-accent="green"] { --accent: #7d9070; --accent-ink: #101711; }
  html[data-theme="light"][data-accent="peach"] { --accent: #e8855a; --accent-ink: #241305; }
  html[data-theme="light"][data-accent="sky"]   { --accent: #7fadd9; --accent-ink: #0d1a26; }

  html, body { height: 100%; }
  body {
    background: var(--page-bg);
    color: var(--ink);
    font-family: "SF Pro Text", "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  button { font-family: inherit; }
  button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
  .visually-hidden {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap;
  }

  /* ---------- Setup screen ---------- */
  html[data-theme="dark"] body:has(#setup-view:not([hidden])) { background: #0e1c15; }
  html[data-theme="dark"] .setup { --ink: #f0efda; --control-bg: #1a2c22; --line: #3a4d3d; color: var(--ink); }
  .setup {
    min-height: 100dvh; display: flex; flex-direction: column; align-items: stretch;
    gap: 22px; padding: 28px 20px; max-width: 620px; margin: 0 auto; width: 100%;
  }
  .setup h1 { font-size: clamp(2rem, 7vw, 2.8rem); font-weight: 800; letter-spacing: -0.01em; }
  .setup .lead { color: var(--ink-dim); font-size: 1.05rem; margin: -10px 0 4px; }
  .setup-hero { display: grid; grid-template-columns: minmax(0, 1fr) 100px; align-items: center; gap: 10px; }
  .setup-kicker { grid-column: 1 / -1; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-dim); }
  .setup h1 { font-size: clamp(2rem, 10.25vw, 3rem); line-height: 1.08; letter-spacing: -0.035em; }
  .setup-clock { display: block; width: 100%; height: auto; overflow: visible; }
  .clock-case { fill: var(--accent); stroke: #233f31; stroke-width: 4; }
  .clock-window { fill: #203e30; }
  .clock-digits { fill: none; stroke: #f0efda; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .setup .lead { font-size: clamp(0.875rem, 3.7vw, 1.05rem); }
  .start { box-shadow: 0 5px 0 #748b5f; display: flex; align-items: center; justify-content: center; gap: 16px; }
  .start svg { width: 24px; height: 24px; flex: none; }
  .tile::after { content: 'Selected'; visibility: hidden; font-size: 0.8rem; font-weight: 800; margin-top: 6px; }
  .tile[aria-pressed="true"]::after { visibility: visible; }
  /* Let real enlarged text reflow rather than shrink it to keep the illustration alongside. */
  @media (max-width: 360px) { .setup-hero { grid-template-columns: minmax(0, 1fr) 80px; gap: 8px; } }
  @media (min-width: 700px) { .setup-hero { grid-template-columns: minmax(0, 1fr) 120px; } }


  .setup-section { display: flex; flex-direction: column; gap: 12px; }
  .setup-section h2, .sheet-section h3 {
    font-size: 0.85rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim);
  }
  .picker { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
  .picker legend, .picker .group-label, .sheet .group-label {
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim);
  }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    min-height: 48px; padding: 10px 18px; border-radius: 999px; cursor: pointer;
    border: 2px solid var(--line); background: var(--control-bg); color: var(--control-ink);
    font-size: 1rem; font-weight: 700;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  /* Swatch-only colour chips: no text name, the colour itself is the label. */
  .chip-swatch { width: 52px; min-width: 52px; padding: 0; justify-content: center; }
  .chip-swatch .swatch { width: 24px; height: 24px; }
  .start {
    min-height: 64px; padding: 16px 42px; border-radius: 18px; border: 0; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font-size: 1.3rem; font-weight: 800; width: 100%;
  }


  /* Time preset tiles */
  .preset-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 8em), 1fr)); gap: 10px; }
  .tile {
    display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left;
    padding: 14px; border-radius: 18px; border: 2px solid var(--line);
    background: var(--control-bg); color: var(--control-ink); cursor: pointer;
  }
  .tile .tile-big { font-size: 1.65rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tile .tile-sub { font-size: 0.85rem; color: var(--ink-dim); font-weight: 650; line-height: 1.35; }
  .tile[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  /* Full ink on the selected fill: 75% opacity dropped small helper text
     below the 4.5:1 contrast floor in some colour combos. */
  .tile[aria-pressed="true"] .tile-sub { color: var(--accent-ink); }

  /* Collapsed sections: the summary reads as a tappable row, not plain text. */
  .disclosure summary {
    list-style: none;
    cursor: pointer; font-size: 1rem; font-weight: 800; min-height: 52px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px; border-radius: 14px;
    border: 2px solid var(--line); background: var(--control-bg); color: var(--control-ink);
  }
  .disclosure summary::-webkit-details-marker { display: none; }
  .disclosure summary::after { content: "\203A"; font-size: 1.4rem; font-weight: 800; line-height: 1; transition: transform 0.15s ease; }
  .disclosure[open] summary::after { transform: rotate(90deg); }
  .disclosure > *:not(summary) { margin-top: 12px; }
  .disclosure .picker { margin-bottom: 20px; }

  /* Player name fields */
  .name-fields { display: flex; flex-direction: column; gap: 12px; }
  .name-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .name-row > * { flex: 1 1 9em; }
  .name-field {
    display: flex; flex-direction: column; gap: 6px; min-width: 0;
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.11em; text-transform: uppercase; color: var(--ink-dim);
  }
  .name-fields input {
    font: inherit; font-size: 1.05rem; font-weight: 700; text-transform: none; letter-spacing: normal;
    padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--control-bg); color: var(--ink); width: 100%; min-width: 0;
  }

  /* Colour swatches */
  .swatch { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line); flex: none; }
  .swatch-green { background: #a8b598; }
  .swatch-peach { background: #f0996f; }
  .swatch-sky { background: #9fc3e8; }
  .chip[aria-pressed="true"] .swatch { border-color: var(--accent-ink); }

  /* ---------- Settings sheet ---------- */
  .sheet-backdrop {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); z-index: 40;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .sheet {
    background: var(--bar-bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 24px 24px 0 0; padding: 16px 20px 28px; width: 100%; max-width: 520px;
    display: flex; flex-direction: column; gap: 20px; max-height: 92dvh; overflow-y: auto;
  }
  /* Children never shrink to fit: at enlarged text the sheet scrolls
     instead of squashing buttons until their text spills out. */
  .sheet > * { flex: none; }
  .sheet-top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap;
    position: sticky; top: -16px; background: var(--bar-bg); padding: 6px 0; z-index: 2;
  }
  /* Wraps onto its own row, still right-aligned, rather than overflowing
     the sheet's right edge when the heading needs the width. */
  .sheet-close-btn { margin-left: auto; }
  .sheet h2 { font-size: 1.25rem; font-weight: 800; text-align: left; min-width: 0; }
  .sheet-close-btn {
    min-height: 44px; padding: 8px 18px; border-radius: 999px; cursor: pointer;
    border: 2px solid var(--line); background: var(--control-bg); color: var(--control-ink);
    font-size: 0.95rem; font-weight: 800; flex: none;
  }
  .resume {
    min-height: 56px; border-radius: 16px; border: 0; cursor: pointer; width: 100%;
    background: var(--accent); color: var(--accent-ink); font-size: 1.15rem; font-weight: 800;
  }
  .sheet-section { display: flex; flex-direction: column; gap: 12px; }
  /* Label column plus one aligned control column: every picker group shares
     the same left edge, width and height, and wraps as a whole below its
     label when enlarged text needs the room. */
  .sheet .row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font-size: 1rem; }
  .sheet .row .group-label { flex: 0 1 8em; min-width: 0; }
  .sheet .row .chips { flex: 1 1 12.5em; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; max-width: 100%; }
  .sheet .row .chips .chip { width: 100%; min-width: 0; padding-left: 6px; padding-right: 6px; justify-content: center; }
  .sheet .row .chips .chip-swatch { width: 100%; min-width: 0; padding: 0; }
  .sheet .row .hint { flex-basis: 100%; }
  .sheet .hint { margin: 0; font-size: 0.85rem; color: var(--ink-dim); }
  .sheet-actions { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; position: sticky; bottom: -28px; padding-bottom: 28px; background: var(--bar-bg); }
  .sheet-actions .chip { width: 100%; min-width: 0; justify-content: center; }
  .sheet-divider { border: 0; border-top: 1px solid var(--line); margin: 0; }
  .sheet-danger { align-self: stretch; justify-content: center; }
  .sheet-danger.confirm { background: var(--low-bg, #c04b28); border-color: var(--low-bg, #c04b28); color: #fff4ef; }
  /* Armed confirm takes the whole row so its longer label stays short enough
     to keep the button inside the visible sheet at small widths / 200% text. */
  .sheet-actions .chip.confirm { grid-column: 1 / -1; }

  /* ---------- Clock screen ---------- */
  .clock {
    display: grid; grid-template-rows: 1fr auto 1fr; height: 100dvh; overflow: hidden;
    gap: var(--gap, 0); padding: var(--page-pad, 0);
  }
  .player {
    border: 0; width: 100%; min-width: 0; min-height: 0; cursor: pointer; position: relative;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 16px; border-radius: var(--radius, 0);
    background: var(--inactive-bg); color: var(--inactive-ink);
    touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  .player.top { transform: rotate(180deg); }
  .player .pname { font-size: 1rem; font-weight: 800; letter-spacing: 0.06em; }
  .player .time {
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums; line-height: 1;
    /* Sized from the viewport and fitted to the card by script (fitTimes), so
       digits never clip or push the layout past 320px at any text size. */
    font-size: min(21vw, 30vh); font-weight: var(--digit-weight, 800);
    max-width: 100%; white-space: nowrap;
  }
  .player .note { font-size: 0.95rem; font-weight: 700; min-height: 1.4em; }
  .player .flag-line { position: absolute; top: 0; left: 0; right: 0; height: 4px; background: transparent; }

  /* Active (to move) player */
  .player.active { background: var(--accent); color: var(--accent-ink); }

  /* Low time */
  .player.active.low { background: var(--low-bg, #c04b28); color: var(--low-ink, #fff4ef); }
  html[data-theme="light"] .player.active.low { --low-bg: #a53c1e; }

  /* Turn pill on the active player */
  .turn-pill {
    display: none; font-size: 0.8rem; font-weight: 800; border-radius: 999px; padding: 7px 16px;
    background: var(--accent-ink); color: var(--accent); letter-spacing: 0.04em;
    max-width: 100%; text-align: center;
  }
  html[data-style="players"] .player.active .turn-pill { display: inline-block; }
  html[data-style="players"] .player.active.low .turn-pill { background: var(--low-ink, #fff4ef); color: var(--low-bg, #c04b28); }

  /* Winner */
  .player.winner { background: var(--accent); color: var(--accent-ink); }

  /* Style: players - chunky rounded cards. The whole half stays tappable:
     the button fills its half and the card is a painted layer inside it.
     The top player is rotated 180 degrees, which flips the inset to match. */
  html[data-style="players"] .clock { --gap: 0; --page-pad: 0; --digit-weight: 800; }
  html[data-style="players"] .player { padding: 22px; }
  html[data-style="players"] .player,
  html[data-style="players"] .player.active,
  html[data-style="players"] .player.active.low,
  html[data-style="players"] .player.winner { background: transparent; }
  html[data-style="players"] .player::before {
    content: ""; position: absolute; inset: 6px 12px 12px; border-radius: 28px;
    background: var(--inactive-bg); border: 3px solid var(--line);
  }
  /* Positioned layers paint above the card layer, keeping text on top. */
  html[data-style="players"] .player > * { position: relative; }
  html[data-style="players"] .player.active::before { background: var(--accent); border-color: var(--accent); }
  html[data-style="players"] .player.active.low::before { background: var(--low-bg, #c04b28); border-color: var(--low-bg, #c04b28); }
  html[data-style="players"] .player.winner::before { background: var(--accent); border-color: var(--accent); }

  /* Centre control bar */
  .bar {
    display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap;
    min-width: 0; row-gap: 8px;
    background: var(--bar-bg); padding: 10px 12px;
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    border-radius: var(--bar-radius, 0);
  }
  html[data-style="players"] .bar { --bar-radius: 20px; border: 2px solid var(--line); margin: 0 12px; }
  .bar button {
    line-height: 1;
    min-width: 52px; min-height: 52px; border-radius: 18px; border: 2px solid var(--line);
    background: var(--control-bg); color: var(--control-ink); font-size: 1.2rem; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; padding: 0 14px;
  }
  .bar button[aria-disabled="true"] { opacity: 0.4; cursor: default; }
  .bar button.bar-toggle { font-size: 1rem; font-weight: 800; }
  .bar button.bar-toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .bar .status { font-size: 0.85rem; color: var(--ink-dim); font-weight: 700; min-width: 0; text-align: center; }
  .bar button.confirm { background: var(--low-bg, #c04b28); border-color: var(--low-bg, #c04b28); color: #fff4ef; font-size: 0.95rem; font-weight: 800; }
  /* Narrow screens: compact buttons in two even rows of two, with the
     status on its own full-width row, so nothing is orphaned and enlarged
     labels stay inside their buttons. */
  @media (max-width: 560px) {
    .bar { display: grid; grid-template-columns: repeat(2, 1fr); grid-auto-rows: minmax(44px, auto); gap: 8px; padding: 8px 10px; }
    .bar button { width: 100%; min-width: 0; min-height: 44px; padding: 0 8px; }
    .bar .status { grid-column: 1 / -1; order: -1; align-self: center; }
    .bar button#again-btn, .bar button#bar-change { grid-column: 1 / -1; }
  }

  /* Ended state banner inside the winner panel. Its height is always reserved,
     so the message never pushes the name or digits out of the card. */
  .player .result { display: block; visibility: hidden; min-height: 1.3em; font-size: 1.05rem; font-weight: 800; }
  .player .result:not(:empty) { visibility: visible; }
  /* Once the game is decided the low-time note can never appear again; drop
     its reserved height so the winner line always fits the card. */
  .player.winner .note { display: none; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<!-- ============ Setup screen ============ -->
<main class="setup" id="setup-view">
  <header class="setup-hero">
    <p class="setup-kicker">A little time to play</p>
    <h1>Play chess</h1>
    <svg class="setup-clock" viewBox="0 0 180 142" aria-hidden="true" focusable="false">
      <ellipse cx="90" cy="133" rx="84" ry="7" fill="#233f31"/>
      <rect x="24" y="4" width="44" height="16" rx="7" fill="#dac698"/>
      <rect x="112" y="4" width="44" height="16" rx="7" fill="#dac698"/>
      <path class="clock-case" d="M17 23 H163 L175 117 Q177 130 162 130 H18 Q3 130 5 117 Z"/>
      <rect class="clock-window" x="24" y="46" width="62" height="49" rx="6"/>
      <rect class="clock-window" x="94" y="46" width="62" height="49" rx="6"/>
      <g class="clock-digits" id="setup-clock-left"></g>
      <g class="clock-digits" id="setup-clock-right"></g>
      <rect x="78" y="112" width="24" height="5" rx="2.5" fill="#526c45"/>
    </svg>
  </header>
  <p class="lead">Two timers. One tap per move.</p>

  <p class="visually-hidden" id="play-summary"></p>
  <button class="start" id="start-btn" aria-describedby="play-summary">Play <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 19 19 5 M7 5h12v12"/></svg></button>

  <section class="setup-section" aria-labelledby="time-heading">
    <h2 id="time-heading">Time</h2>
    <div class="preset-tiles" id="preset-tiles" role="group" aria-label="Time control">
      <button class="tile" data-preset="1,0" aria-pressed="false"><span class="tile-big">1 + 0</span><span class="tile-sub">1 minute each, nothing added</span></button>
      <button class="tile" data-preset="3,2" aria-pressed="false"><span class="tile-big">3 + 2</span><span class="tile-sub">3 minutes each, 2 seconds a move</span></button>
      <button class="tile" data-preset="5,0" aria-pressed="false"><span class="tile-big">5 + 0</span><span class="tile-sub">5 minutes each, nothing added</span></button>
      <button class="tile" data-preset="10,3" aria-pressed="true"><span class="tile-big">10 + 3</span><span class="tile-sub">10 minutes each, 3 seconds a move</span></button>
    </div>
    <details class="disclosure" id="custom-time">
      <summary>Custom time</summary>
      <fieldset class="picker" style="border:0">
        <legend>Minutes each</legend>
        <div class="chips" id="time-chips" role="group" aria-label="Minutes each">
          <button class="chip" data-minutes="1" aria-pressed="false">1 min</button>
          <button class="chip" data-minutes="3" aria-pressed="false">3 min</button>
          <button class="chip" data-minutes="5" aria-pressed="false">5 min</button>
          <button class="chip" data-minutes="10" aria-pressed="true">10 min</button>
        </div>
      </fieldset>
      <fieldset class="picker" style="border:0">
        <legend>Extra seconds a move</legend>
        <div class="chips" id="inc-chips" role="group" aria-label="Extra seconds a move">
          <button class="chip" data-inc="0" aria-pressed="false">None</button>
          <button class="chip" data-inc="2" aria-pressed="false">+2s</button>
          <button class="chip" data-inc="3" aria-pressed="true">+3s</button>
          <button class="chip" data-inc="5" aria-pressed="false">+5s</button>
        </div>
      </fieldset>
    </details>
  </section>

  <section class="setup-section" aria-labelledby="players-heading">
    <h2 id="players-heading">Players</h2>
    <div class="name-fields">
      <div class="name-row">

<script>
(function () {
  'use strict';

  var SETTINGS_KEY = 'chess-clock-settings';
  var GAME_KEY = 'chess-clock-game';

  var el = {
    html: document.documentElement,
    setup: document.getElementById('setup-view'),
    clock: document.getElementById('clock-view'),
    start: document.getElementById('start-btn'),
    p1: document.getElementById('p1'),
    p2: document.getElementById('p2'),
    p1time: document.getElementById('p1-time'),
    p2time: document.getElementById('p2-time'),
    p1note: document.getElementById('p1-note'),
    p2note: document.getElementById('p2-note'),
    p1result: document.getElementById('p1-result'),
    p2result: document.getElementById('p2-result'),
    pause: document.getElementById('pause-btn'),
    soundToggle: document.getElementById('sound-toggle'),
    movesToggle: document.getElementById('moves-toggle'),
    reset: document.getElementById('sheet-reset'),
    settingsBtn: document.getElementById('settings-btn'),
    again: document.getElementById('again-btn'),
    barChange: document.getElementById('bar-change'),
    barStatus: document.getElementById('bar-status'),
    sheet: document.getElementById('settings-sheet'),
    sheetClose: document.getElementById('sheet-close'),
    sheetChangeTime: document.getElementById('sheet-change-time'),
    sheetResume: document.getElementById('sheet-resume'),
    nameP1: document.getElementById('name-p1'),
    nameP2: document.getElementById('name-p2'),
    p1name: document.querySelector('#p1 .pname'),
    p2name: document.querySelector('#p2 .pname'),
    playSummary: document.getElementById('play-summary')
  };

  /* ---------- settings ---------- */
  var settings = { theme: 'dark', accent: 'green', sound: 'on', moves: 'off', minutes: 10, inc: 3, p1name: 'Player 1', p2name: 'Player 2' };
  try {
    var savedSettings = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
    for (var k in settings) if (savedSettings[k] !== undefined) settings[k] = savedSettings[k];
  } catch (e) {}

  function saveSettings() {
    try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
  }

  function applyDisplay() {
    el.html.dataset.theme = settings.theme;
    el.html.dataset.style = 'players';
    el.html.dataset.accent = settings.accent;
    syncPickers();
    renderNotes();
  }

  function syncPickers() {
    updateSummary();
    pressGroup('time-chips', 'minutes', String(settings.minutes));
    pressGroup('inc-chips', 'inc', String(settings.inc));
    pressGroup('preset-tiles', 'preset', settings.minutes + ',' + settings.inc);
    pressGroup('accent-chips', 'accent-pick', settings.accent);
    pressGroup('theme-chips', 'theme-pick', settings.theme);
    pressGroup('sheet-accent-chips', 'accent-pick', settings.accent);
    pressGroup('sheet-theme-chips', 'theme-pick', settings.theme);
    pressGroup('sheet-moves-chips', 'moves-pick', settings.moves);
    pressGroup('sheet-sound-chips', 'sound-pick', settings.sound);
    pressGroup('setup-moves-chips', 'moves-pick', settings.moves);
    pressGroup('setup-sound-chips', 'sound-pick', settings.sound);
  }

  function nameOf(side) {
    var raw = side === 'p1' ? settings.p1name : settings.p2name;
    var name = (raw || '').trim();
    return name || (side === 'p1' ? 'Player 1' : 'Player 2');
  }

  function renderNames() {
    el.p1name.textContent = nameOf('p1');
    el.p2name.textContent = nameOf('p2');
  }

  function updateSummary() {
    renderSetupClock();
    el.playSummary.textContent = settings.minutes + ' + ' + settings.inc + ' - ' + nameOf('p1') + ' (bottom) vs ' + nameOf('p2') + ' (top)';
  }

  // Path digits keep this decorative miniature crisp at any zoom, without
  // inheriting enlarged UI text into its fixed readout windows.
  function renderSetupClock() {
    var numerals = [
      'M4 1Q0 1 0 5V13Q0 17 4 17Q8 17 8 13V5Q8 1 4 1Z',
      'M1 4L4 1H5V17 M1 17H8',
      'M0 4Q0 1 4 1Q8 1 8 5Q8 8 4 11L0 15V17H8',
      'M0 2Q8 -1 8 5Q8 9 4 9Q8 9 8 13Q8 19 0 16',
      'M6 17V1L0 12H8',
      'M8 1H0V8H4Q8 8 8 12V13Q8 19 0 16',
      'M8 2Q0 -1 0 7V13Q0 17 4 17Q8 17 8 13V12Q8 7 0 9',
      'M0 1H8L2 17',
      'M4 9Q0 9 0 5Q0 1 4 1Q8 1 8 5Q8 9 4 9Q0 9 0 13Q0 17 4 17Q8 17 8 13Q8 9 4 9',
      'M0 16Q8 19 8 11V5Q8 1 4 1Q0 1 0 5V6Q0 11 8 9'
    ];
    var minutes = Number(settings.minutes);
    var label = String(Number.isFinite(minutes) && minutes > 0 && minutes <= 999 ? Math.floor(minutes) : 10) + ':00';
    ['setup-clock-left', 'setup-clock-right'].forEach(function (id, side) {
      var group = document.getElementById(id);
      group.replaceChildren();
      group.setAttribute('data-time', label);
      var width = label.length * 12 - 4;
      var scale = Math.min(1, 48 / width);
      var start = (side ? 125 : 55) - width * scale / 2;
      for (var i = 0; i < label.length; i++) {
        var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        var d = label[i] === ':' ? 'M4 6v1 M4 12v1' : numerals[Number(label[i])];
        path.setAttribute('d', d);
        path.setAttribute('transform', 'translate(' + (start + i * 12 * scale) + ' 62) scale(' + scale + ' 1)');
        group.appendChild(path);
      }
    });
  }

  function pressGroup(containerId, dataKey, value) {
    var container = document.getElementById(containerId);
    if (!container) return;
    var buttons = container.querySelectorAll('button');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].setAttribute('aria-pressed', String(buttons[i].getAttribute('data-' + dataKey) === value));
    }
  }

  function bindPicker(containerId, dataKey, apply) {
    var container = document.getElementById(containerId);
    if (!container) return;
    container.addEventListener('click', function (event) {
      var button = event.target.closest('button');
      if (!button) return;
      apply(button.getAttribute('data-' + dataKey));
    });
  }

  bindPicker('time-chips', 'minutes', function (v) { settings.minutes = Number(v); saveSettings(); syncPickers(); });
  bindPicker('inc-chips', 'inc', function (v) { settings.inc = Number(v); saveSettings(); syncPickers(); });
  bindPicker('accent-chips', 'accent-pick', function (v) { settings.accent = v; saveSettings(); applyDisplay(); });
  bindPicker('theme-chips', 'theme-pick', function (v) { settings.theme = v; saveSettings(); applyDisplay(); });
  bindPicker('sheet-accent-chips', 'accent-pick', function (v) { settings.accent = v; saveSettings(); applyDisplay(); });
  bindPicker('sheet-theme-chips', 'theme-pick', function (v) { settings.theme = v; saveSettings(); applyDisplay(); });
  bindPicker('sheet-moves-chips', 'moves-pick', function (v) { settings.moves = v; saveSettings(); syncPickers(); renderNotes(); renderBarToggles(); });
  bindPicker('sheet-sound-chips', 'sound-pick', function (v) { if (v !== settings.sound) beep(660, 0.12, 0, true); settings.sound = v; saveSettings(); syncPickers(); renderBarToggles(); });
  bindPicker('setup-moves-chips', 'moves-pick', function (v) { settings.moves = v; saveSettings(); syncPickers(); renderNotes(); renderBarToggles(); });
  bindPicker('setup-sound-chips', 'sound-pick', function (v) { settings.sound = v; saveSettings(); syncPickers(); renderBarToggles(); });
  bindPicker('preset-tiles', 'preset', function (v) {
    var parts = v.split(',');
    settings.minutes = Number(parts[0]);
    settings.inc = Number(parts[1]);
    saveSettings();
    syncPickers();
    updateSummary();
  });
  bindPicker('time-chips', 'minutes', function (v) { updateSummary(); });
  bindPicker('inc-chips', 'inc', function (v) { updateSummary(); });
  el.nameP1.addEventListener('input', function () { settings.p1name = el.nameP1.value; saveSettings(); renderNames(); updateSummary(); renderNotes(); });
  el.nameP2.addEventListener('input', function () { settings.p2name = el.nameP2.value; saveSettings(); renderNames(); updateSummary(); renderNotes(); });

  /* ---------- sound ---------- */
  var audioCtx = null;
  function ensureAudio() {
    if (settings.sound !== 'on') return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
  }
  // Browsers only unlock audio inside a user gesture; the first tap wakes the context.
  document.addEventListener('pointerdown', ensureAudio);
  function beep(frequency, duration, delay, force) {
    if (!force && settings.sound !== 'on') return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var start = function () {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.frequency.value = frequency;
        osc.type = 'sine';
        var at = audioCtx.currentTime + (delay || 0);
        gain.gain.setValueAtTime(0.0001, at);
        gain.gain.exponentialRampToValueAtTime(0.08, at + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + duration);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(at);
        osc.stop(at + duration + 0.02);
      };
      // Notes scheduled on a suspended context are lost, so wait for the resume.
      if (audioCtx.state === 'suspended') audioCtx.resume().then(start).catch(function () {});
      else start();
    } catch (e) {}
  }
  function clickSound() { beep(1200, 0.05, 0); }
  function alarmSound() { beep(880, 0.18, 0); beep(880, 0.18, 0.25); beep(660, 0.3, 0.5); }

  /* ---------- wake lock ---------- */
  var wakeLock = null;
  function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (lock) {
      wakeLock = lock;
      lock.addEventListener('release', function () { wakeLock = null; });
    }).catch(function () {});
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
  }
  function parkGame() {
    saveGame();
    if (game.phase === 'running') pauseGame(true);
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && game.phase === 'running') requestWakeLock();
    if (document.visibilityState === 'hidden') parkGame();
  });
  window.addEventListener('beforeunload', parkGame);
  window.addEventListener('pagehide', parkGame);

  /* ---------- game state ---------- */
  var game = {
    phase: 'setup', // setup | ready | running | paused | ended
    active: null,   // 'p1' | 'p2'
    remaining: { p1: 5 * 60000, p2: 5 * 60000 },
    moves: { p1: 0, p2: 0 },
    lastTick: null,
    winner: null
  };

  function baseMs() { return settings.minutes * 60000; }
  function incMs() { return settings.inc * 1000; }

  function saveGame() {
    if (game.phase === 'setup') return;
    try {
      localStorage.setItem(GAME_KEY, JSON.stringify({
        phase: game.phase === 'running' ? 'paused' : game.phase,
        active: game.active,
        remaining: game.remaining,
        moves: game.moves,
        winner: game.winner,
        minutes: settings.minutes,
        inc: settings.inc,
        savedAt: Date.now()
      }));
    } catch (e) {}
  }

  function restoreGame() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(GAME_KEY) || 'null'); } catch (e) {}
    if (!saved || !saved.savedAt) return false;
    if (Date.now() - saved.savedAt > 12 * 3600 * 1000) return false;
    if (saved.minutes !== settings.minutes || saved.inc !== settings.inc) return false;
    game.phase = saved.phase === 'running' ? 'paused' : saved.phase;
    game.active = saved.active;
    game.remaining = saved.remaining;
    game.moves = saved.moves || { p1: 0, p2: 0 };
    game.winner = saved.winner || null;
    return true;
  }

  /* ---------- timing ---------- */
  var timer = null;
  function startTimer() {
    stopTimer();
    game.lastTick = Date.now();
    timer = setInterval(function () {
      var now = Date.now();
      var delta = now - game.lastTick;
      game.lastTick = now;
      if (game.phase === 'running' && game.active) {
        game.remaining[game.active] = Math.max(0, game.remaining[game.active] - delta);
        renderTimes();
        if (game.remaining[game.active] <= 0) endGame(other(game.active));
      }
    }, 100);
  }
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

  function other(side) { return side === 'p1' ? 'p2' : 'p1'; }

  /* ---------- actions ---------- */
  function startGame() {
    game.phase = 'ready';
    game.active = null;
    game.remaining = { p1: baseMs(), p2: baseMs() };
    game.moves = { p1: 0, p2: 0 };
    game.winner = null;
    el.setup.hidden = true;
    el.clock.hidden = false;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    startTimer();
    renderAll();
  }

  function press(side) {
    if (game.phase === 'paused') {
      // A tap on either side resumes; the side to move keeps ticking.
      resumeGame();
      clickSound();
      return;
    }
    if (game.phase === 'ready') {
      // First press starts the other player's clock, like Black starting White's clock.
      game.phase = 'running';
      game.active = other(side);
      game.lastTick = Date.now();
      requestWakeLock();
      clickSound();
      renderAll();
      return;
    }
    if (game.phase !== 'running' || side !== game.active) return;
    game.moves[side] += 1;
    game.remaining[side] += incMs();
    game.active = other(side);
    clickSound();
    saveGame();
    renderAll();
  }

  function pauseGame(silent) {
    if (game.phase !== 'running') return;
    game.phase = 'paused';
    releaseWakeLock();
    if (!silent) saveGame();
    renderAll();
  }

  function resumeGame() {
    if (game.phase !== 'paused') return;
    game.phase = 'running';
    game.lastTick = Date.now();
    requestWakeLock();
    renderAll();
  }

  var resetArmed = false;
  var resetTimer = null;
  function requestReset() {
    if (!resetArmed) {
      resetArmed = true;
      el.reset.classList.add('confirm');
      el.reset.textContent = 'Reset?';
      el.reset.setAttribute('aria-label', 'Tap again to confirm reset');
      resetTimer = setTimeout(disarmReset, 3000);
      return;
    }
    doReset();
  }
  function disarmReset() {
    resetArmed = false;
    clearTimeout(resetTimer);
    el.reset.classList.remove('confirm');
    el.reset.textContent = 'Reset game';
    el.reset.setAttribute('aria-label', 'Reset game');
  }
  function doReset() {
    disarmReset();
    game.phase = 'ready';
    game.active = null;
    game.remaining = { p1: baseMs(), p2: baseMs() };
    game.moves = { p1: 0, p2: 0 };
    game.winner = null;
    releaseWakeLock();
    saveGame();
    renderAll();
  }

  function endGame(winner) {
    game.phase = 'ended';
    game.winner = winner;
    releaseWakeLock();
    alarmSound();
    saveGame();
    renderAll();
  }

  function changeTime() {
    stopSheet();
    stopTimer();
    releaseWakeLock();
    game.phase = 'setup';
    try { localStorage.removeItem(GAME_KEY); } catch (e) {}
    el.clock.hidden = true;
    el.setup.hidden = false;
    el.start.focus();
  }

  /* ---------- settings sheet ---------- */
  var sheetDialog = el.sheet.querySelector('.sheet');
  function openSheet() {
    if (game.phase === 'running') pauseGame();
    document.getElementById('settings-title').textContent =
      game.phase === 'paused' ? 'Game paused' : 'Clock settings';
    el.sheet.hidden = false;
    sheetDialog.scrollTop = 0;
    el.clock.inert = true;
    el.setup.inert = true;
    sheetDialog.focus({ preventScroll: true });
  }
  function closeSheet() {
    stopSheet();
    el.settingsBtn.focus();
  }
  function trapSheetTab(event) {
    var buttons = sheetDialog.querySelectorAll('button');
    if (!buttons.length) return;
    var first = buttons[0];
    var last = buttons[buttons.length - 1];
    var inside = sheetDialog.contains(document.activeElement);
    if (event.shiftKey && (!inside || document.activeElement === first)) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && (!inside || document.activeElement === last)) {
      event.preventDefault();
      first.focus();
    }
  }
  function stopSheet() {
    el.sheet.hidden = true;
    el.clock.inert = false;
    el.setup.inert = false;
  }

  /* ---------- rendering ---------- */
  function fmt(ms) {
    var totalTenths = Math.ceil(ms / 100);
    var tenths = totalTenths % 10;
    var totalSeconds = Math.floor(totalTenths / 10);
    var seconds = totalSeconds % 60;
    var minutes = Math.floor(totalSeconds / 60);
    if (totalSeconds < 20) return minutes + ':' + String(seconds).padStart(2, '0') + '.' + tenths;
    return minutes + ':' + String(seconds).padStart(2, '0');
  }

  function renderTimes() {
    var t1 = fmt(game.remaining.p1);
    var t2 = fmt(game.remaining.p2);
    if (t1 !== el.p1time.textContent) { el.p1time.textContent = t1; fitTime(el.p1time); }
    if (t2 !== el.p2time.textContent) { el.p2time.textContent = t2; fitTime(el.p2time); }
    el.p1.classList.toggle('low', game.phase === 'running' && game.active === 'p1' && game.remaining.p1 <= 10000);
    el.p2.classList.toggle('low', game.phase === 'running' && game.active === 'p2' && game.remaining.p2 <= 10000);
  }

  /* Fit the digits to their card: start from the stylesheet size and shrink
     until the text fits, whatever the inherited or set text size. Also caps
     the height so the digits can never overlap the control bar. */
  // The height the digits may take: what is left of the card once the name,
  // note, pill, result line, padding, gaps and the painted card inset have
  // their share. Keeps every line inside the visible card at any text size.
  function fitBudget(t) {
    var panel = t.parentElement;
    var cs = getComputedStyle(panel);
    var siblings = 0;
    var inFlow = 0;
    for (var i = 0; i < panel.children.length; i++) {
      var sib = panel.children[i];
      var scs = getComputedStyle(sib);
      if (scs.display === 'none' || scs.position === 'absolute') continue;
      inFlow++;
      if (sib !== t) siblings += sib.getBoundingClientRect().height;
    }
    var padV = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    var gaps = Math.max(0, inFlow - 1) * (parseFloat(cs.rowGap) || 0);
    var insetV = 0;
    var before = getComputedStyle(panel, '::before');
    if (before && before.position === 'absolute') {
      insetV = (parseFloat(before.top) || 0) + (parseFloat(before.bottom) || 0);
    }
    return panel.clientHeight - siblings - padV - gaps - insetV - 4;
  }
  function fitTime(t) {
    if (!t || el.clock.hidden) return;
    t.style.fontSize = '';
    var size = parseFloat(getComputedStyle(t).fontSize);
    if (!size) return;
    var maxHeight = Math.max(40, fitBudget(t));
    var guard = 60;
    while (guard-- > 0 && size > 10 && (t.scrollWidth > t.clientWidth || t.scrollHeight > maxHeight)) {
      size *= 0.92;
      t.style.fontSize = size.toFixed(1) + 'px';
    }
  }
  function fitTimes() {
    fitTime(el.p1time);
    fitTime(el.p2time);
  }
  window.addEventListener('resize', fitTimes);
  // Refit when the digits outgrow their card for any reason: their own font
  // changes, or siblings grow (root text zoom) and squeeze the card. Guarded
  // by the overflow check so fitting never loops.
  function timeOverflows(t) {
    if (!t || el.clock.hidden) return false;
    return t.scrollWidth > t.clientWidth + 1 || t.scrollHeight > fitBudget(t);
  }
  var timeRO = typeof ResizeObserver === 'function' ? new ResizeObserver(function () {
    if (timeOverflows(el.p1time)) fitTime(el.p1time);
    if (timeOverflows(el.p2time)) fitTime(el.p2time);
  }) : null;
  if (timeRO) {
    [el.p1, el.p2].forEach(function (panel) {
      for (var i = 0; i < panel.children.length; i++) timeRO.observe(panel.children[i]);
    });
  }

  function renderNotes() {
    var notes = { p1: '', p2: '' };
    if (game.phase === 'ready') {
      notes.p1 = 'White moves first';
      notes.p2 = 'Black taps to start White\u2019s clock';
    } else if (game.phase === 'paused') {
      notes.p1 = 'Paused - tap either side to resume';
      notes.p2 = 'Paused - tap either side to resume';
    }
    var p1n = nameOf('p1'), p2n = nameOf('p2');
    if (settings.moves === 'on' && (game.phase === 'running' || game.phase === 'paused')) {
      p1n += ' \u00b7 ' + game.moves.p1 + (game.moves.p1 === 1 ? ' move' : ' moves');
      p2n += ' \u00b7 ' + game.moves.p2 + (game.moves.p2 === 1 ? ' move' : ' moves');
    }
    el.p1name.textContent = p1n;
    el.p2name.textContent = p2n;
    el.p1note.textContent = notes.p1;
    el.p2note.textContent = notes.p2;
  }

  function renderBar() {
    var label = settings.minutes + ' min' + (settings.inc ? ' + ' + settings.inc + ' s' : '');
    if (game.phase === 'paused') label = 'Paused';
    if (game.phase === 'ended') label = 'Game over';
    el.barStatus.textContent = label;
    el.pause.innerHTML = game.phase === 'paused' ? '&#9654;' : '&#10073;&#10073;';
    el.pause.setAttribute('aria-label', game.phase === 'paused' ? 'Resume' : 'Pause');
    var pauseEnabled = game.phase === 'running' || game.phase === 'paused';
    el.pause.setAttribute('aria-disabled', String(!pauseEnabled));
    var resetEnabled = game.phase !== 'setup';
    el.reset.setAttribute('aria-disabled', String(!resetEnabled));
    if (!resetEnabled) disarmReset();
    // Ended games swap the controls for a clear Play again + Change time.
    var ended = game.phase === 'ended';
    el.pause.hidden = ended;
    el.soundToggle.hidden = ended;
    el.movesToggle.hidden = ended;
    el.settingsBtn.hidden = ended;
    el.again.hidden = !ended;
    el.barChange.hidden = !ended;
  }

  function renderPlayers() {
    el.p1.classList.toggle('active', game.phase === 'running' && game.active === 'p1');
    el.p2.classList.toggle('active', game.phase === 'running' && game.active === 'p2');
    el.p1.classList.toggle('winner', game.phase === 'ended' && game.winner === 'p1');
    el.p2.classList.toggle('winner', game.phase === 'ended' && game.winner === 'p2');
    el.p1result.textContent = game.phase === 'ended'
      ? (game.winner === 'p1' ? 'Time! ' + nameOf('p1') + ' wins' : 'Time! ' + nameOf('p1') + '\u2019s flag fell')
      : '';
    el.p2result.textContent = game.phase === 'ended'
      ? (game.winner === 'p2' ? 'Time! ' + nameOf('p2') + ' wins' : 'Time! ' + nameOf('p2') + '\u2019s flag fell')
      : '';

    var label = { p1: nameOf('p1'), p2: nameOf('p2') };
    for (var side of ['p1', 'p2']) {
      var parts = [label[side] + ', ' + spokenTime(game.remaining[side])];
      if (game.phase === 'running' && game.active === side) parts.push('your turn');
      if (game.phase === 'ended' && game.winner === side) parts.push('wins on time');
      (side === 'p1' ? el.p1 : el.p2).setAttribute('aria-label', parts.join(', '));
    }
  }

  function spokenTime(ms) {
    var totalSeconds = Math.ceil(ms / 1000);
    var minutes = Math.floor(totalSeconds / 60);
    var seconds = totalSeconds % 60;
    return minutes + (minutes === 1 ? ' minute ' : ' minutes ') + seconds + (seconds === 1 ? ' second' : ' seconds');
  }

  var ICON_SOUND_ON = '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18 6a8.5 8.5 0 0 1 0 12"/></svg>';
  var ICON_SOUND_OFF = '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor" stroke="none"/><line x1="16" y1="9" x2="22" y2="15"/><line x1="22" y1="9" x2="16" y2="15"/></svg>';

  function renderBarToggles() {
    var soundOn = settings.sound === 'on';
    el.soundToggle.innerHTML = soundOn ? ICON_SOUND_ON : ICON_SOUND_OFF;
    el.soundToggle.setAttribute('aria-pressed', String(soundOn));
    el.soundToggle.setAttribute('aria-label', soundOn ? 'Sound on, tap to mute' : 'Sound off, tap to unmute');
    var movesOn = settings.moves === 'on';
    el.movesToggle.setAttribute('aria-pressed', String(movesOn));
    el.movesToggle.setAttribute('aria-label', movesOn ? 'Move counter on, tap to hide' : 'Move counter off, tap to show');
  }

  function renderAll() {
    renderTimes();
    renderBarToggles();
    renderNotes();
    renderBar();
    renderPlayers();
  }

  /* ---------- wiring ---------- */
  el.start.addEventListener('click', startGame);
  el.p1.addEventListener('pointerdown', function (e) { e.preventDefault(); press('p1'); });
  el.p2.addEventListener('pointerdown', function (e) { e.preventDefault(); press('p2'); });
  // Keyboard activation (Enter / Space) fires click, not pointerdown.
  el.p1.addEventListener('click', function (e) { if (e.detail === 0) press('p1'); });
  el.p2.addEventListener('click', function (e) { if (e.detail === 0) press('p2'); });
  el.pause.addEventListener('click', function () {
    if (game.phase === 'running') pauseGame();
    else if (game.phase === 'paused') resumeGame();
  });
  el.again.addEventListener('click', function () { doReset(); });
  el.barChange.addEventListener('click', function () { changeTime(); });
  el.reset.addEventListener('click', function () {
    if (el.reset.getAttribute('aria-disabled') === 'true') return;
    requestReset();
  });
  el.soundToggle.addEventListener('click', function () {
    beep(660, 0.12, 0, true); // confirmation cue, also before muting
    settings.sound = settings.sound === 'on' ? 'off' : 'on';
    saveSettings(); syncPickers(); renderBarToggles();
  });
  el.movesToggle.addEventListener('click', function () {
    settings.moves = settings.moves === 'on' ? 'off' : 'on';
    saveSettings(); syncPickers(); renderNotes(); renderBarToggles();
  });
  el.settingsBtn.addEventListener('click', openSheet);
  el.sheetClose.addEventListener('click', closeSheet);
  el.sheetResume.addEventListener('click', function () {
    stopSheet();
    resumeGame();
    (game.active === 'p2' ? el.p2 : el.p1).focus();
  });
  // New game discards the clock, so it asks before it acts.
  var changeTimeArmed = false;
  var changeTimeTimer = null;
  el.sheetChangeTime.addEventListener('click', function () {
    if (!changeTimeArmed) {
      changeTimeArmed = true;
      el.sheetChangeTime.classList.add('confirm');
      el.sheetChangeTime.textContent = 'Tap again to reset';
      changeTimeTimer = setTimeout(disarmChangeTime, 3000);
      return;
    }
    disarmChangeTime();
    changeTime();
  });
  function disarmChangeTime() {
    changeTimeArmed = false;
    clearTimeout(changeTimeTimer);
    el.sheetChangeTime.classList.remove('confirm');
    el.sheetChangeTime.textContent = 'New game';
  }
  el.sheet.addEventListener('click', function (event) {
    if (event.target === el.sheet) closeSheet();
  });
  document.addEventListener('keydown', function (event) {
    if (!el.sheet.hidden) {
      if (event.key === 'Escape') closeSheet();
      else if (event.key === 'Tab') trapSheetTab(event);
      return;
    }
    if (el.clock.hidden) return;
    if (event.target.closest && event.target.closest('button') && (event.key === ' ' || event.key === 'Enter')) return;
    if (event.key === ' ') {
      event.preventDefault();
      if (game.phase === 'running' && game.active) press(game.active);
      else if (game.phase === 'ready') press('p1');
    }
    if (event.key === 'p' || event.key === 'P') {
      if (game.phase === 'running') pauseGame();
      else if (game.phase === 'paused') resumeGame();
    }
  });

  /* ---------- boot ---------- */
  el.nameP1.value = settings.p1name;
  el.nameP2.value = settings.p2name;
  applyDisplay();
  renderNames();
  updateSummary();
  var restored = false;
  try { restored = restoreGame(); } catch (e) {}
  if (restored && game.phase !== 'setup') {
    el.setup.hidden = true;
    el.clock.hidden = false;
    startTimer();
  }
  renderAll();
  fitTimes();

  /* Small public surface for the repo's browser checks. */
  window.chessClock = {
    getState: function () {
      return {
        phase: game.phase, active: game.active, winner: game.winner,
        remaining: { p1: game.remaining.p1, p2: game.remaining.p2 },
        moves: { p1: game.moves.p1, p2: game.moves.p2 },
        settings: { theme: settings.theme, accent: settings.accent, sound: settings.sound, moves: settings.moves, minutes: settings.minutes, inc: settings.inc, p1name: settings.p1name, p2name: settings.p2name },
        audio: audioCtx ? audioCtx.state : 'none'
      };
    },
    start: startGame,
    press: press,
    pause: pauseGame,
    resume: resumeGame,
    setRemainingMs: function (side, ms) { game.remaining[side] = ms; renderTimes(); },
    changeTime: changeTime
  };

  /* Keep the clock available for reloads without a connection. */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
})();
</script>
</body>
</html>
